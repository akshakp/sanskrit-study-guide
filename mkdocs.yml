# ============================================
# STEP 1: Replace 'yourusername' with your actual GitHub username
# STEP 2: Make sure your repo is named exactly: sanskrit-study-guide
# ============================================
site_name: Sanskrit Study Guide
site_url: https://akshakp.github.io/sanskrit-study-guide
site_author: Ronak Patel

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/book-open-variant

# Explicit navigation order for left sidebar
nav:
  - Home: index.md
  - Study Topics:
    - Language Essentials: topics/language-essentials.md
    - Nouns & Cases: topics/nouns.md
    - Verbs: topics/verbs.md
    - Verb Roots: topics/dhatu.md
    - Adjectives: topics/adjectives.md
    - Writing Rules: topics/writing-rules.md
    - Sandhi: topics/sandhi.md
    - Krudanta & Taddhita: topics/krudant-tadvid.md
  - Vocabulary: reference/vocabulary.md
  - Conversation: topics/conversation.md
  - Practice Quiz: practice/quiz.md

plugins:
  - search:
      lang:
        - en
        - hi
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      # 'stemmer' is deliberately omitted from the search pipeline. Material's
      # stemmer rewrites English words at index time (lotus->lotu,
      # elephant->eleph, vocabulary->vocabulari), while query terms are matched
      # unstemmed (lunr.js disables the query pipeline for the trailing-asterisk
      # prefix clauses Material adds), so English words whose stem differs from
      # their surface form could never be found in the global search. Literal
      # index tokens keep surface words searchable; Devanagari and Gujarati
      # terms already pass through unchanged.
      pipeline:
        - stopWordFilter
        - trimmer
  - minify:
      minify_html: true

# Appends the Gujarati Unicode range to the Hindi lunr language pack's
# word characters. Without this, the multi-language trimmer that the
# search worker generates strips every Gujarati token out of the global
# search index entirely (Gujarati is not one of the bundled lunr language
# packs, so the generated word-character set only covers Devanagari).
hooks:
  - hooks/gujarati_search.py

extra_javascript:
  - assets/js/vocab-search.js
  - assets/js/quiz.js
  - assets/js/nouns-explorer.js
  - assets/js/nav-site.js
  - assets/js/section-tabs.js
  - assets/js/table-records.js
  - assets/js/formation-labels.js

extra_css:
  - assets/css/main.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/sanskrit-study-guide

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
