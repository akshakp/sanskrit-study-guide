# ============================================
# STEP 1: Replace 'yourusername' with your actual GitHub username
# STEP 2: Make sure your repo is named exactly: sanskrit-study-guide
# ============================================
site_name: Sanskrit Study Guide
site_url: https://akshakp.github.io/sanskrit-study-guide
site_author: Ronak Patel

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/book-open-variant

# Explicit navigation order for left sidebar
nav:
  - Home: index.md
  - Study Topics:
    - Language Essentials: topics/language-essentials.md
    - Nouns & Cases: topics/nouns.md
    - Verbs: topics/verbs.md
    - Verb Roots: topics/dhatu.md
    - Adjectives: topics/adjectives.md
    - Writing Rules: topics/writing-rules.md
    - Sandhi: topics/sandhi.md
    - Krudanta & Taddhita: topics/krudant-tadvid.md
  - Vocabulary: reference/vocabulary.md
  - Conversation: topics/conversation.md
  - Practice Quiz: practice/quiz.md

plugins:
  - search:
      lang:
        - en
        - hi
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  - minify:
      minify_html: true

extra_javascript:
  - assets/js/vocab-search.js
  - assets/js/quiz.js
  - assets/js/nouns-explorer.js
  - assets/js/nav-site.js
  - assets/js/section-tabs.js
  - assets/js/table-records.js
  - assets/js/formation-labels.js
  - assets/js/krudant-search.js

extra_css:
  - assets/css/main.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/sanskrit-study-guide

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
