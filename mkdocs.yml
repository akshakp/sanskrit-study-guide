# ============================================
# STEP 1: Replace 'yourusername' with your actual GitHub username
# STEP 2: Make sure your repo is named exactly: sanskrit-study-guide
# ============================================
site_name: Sanskrit Study Guide
site_url: https://yourusername.github.io/sanskrit-study-guide
site_author: Sanskrit Learner

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # - navigation.sections
    # - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/book-open-variant

# Explicit navigation order for left sidebar
nav:
  - Home: index.md
  - Foundations: sanskrit-foundations.md
  - Grammar:
    - Nouns & Cases (संज्ञा): nouns.md
    - Verbs(क्रियापद): verbs.md
    - Adjective (विशेषण): adjectives.md
  - Rules of writing: writing-rules.md
  - Conversation (संभाषण): conversation.md
  - Vocabulary: 
    - Words: vocabulary.md
    - Verb Roots (धातु): dhatu.md
  - Practice Quiz: quiz.md

plugins:
  - search:
      lang:
        - en
        - hi
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  - minify:
      minify_html: true

extra_javascript:
  - javascripts/vocab-search.js
  - javascripts/quiz.js

extra_css:
  - stylesheets/main.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/sanskrit-study-guide

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
